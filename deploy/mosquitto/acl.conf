# ==============================================================================
# Mosquitto Access Control List (ACL) for Niseva Cloud RMS
# ==============================================================================

# 1. Backend Internal Service: Full read/write access across all topics
user niseva_backend
topic readwrite #

# 2. Device Topic Isolation Pattern
# %c dynamically resolves to the router's Client ID (e.g. NSV-12345)
# Every router is strictly jailed to its own device topics in nanoseconds
pattern readwrite niseva/device/%c/#
