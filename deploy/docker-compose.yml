version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: niseva-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: niseva_rms
      POSTGRES_USER: rms_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-niseva_rms_secret_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rms_admin -d niseva_rms"]
      interval: 5s
      timeout: 5s
      retries: 5

  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: niseva-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "8883:8883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/acl.conf:/mosquitto/config/acl.conf:ro
      - ./mosquitto/password_file:/mosquitto/config/password_file:ro
      - mosquitto_data:/mosquitto/data

  server:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: niseva-rms-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      DATABASE_URL: postgres://rms_admin:${DB_PASSWORD:-niseva_rms_secret_2026}@postgres:5432/niseva_rms?sslmode=disable
      MQTT_BROKER: tcp://mosquitto:1883
      MQTT_USER: niseva_backend
      MQTT_PASSWORD: ${MQTT_PASSWORD:-backend_secret_2026}
      JWT_SECRET: ${JWT_SECRET:-niseva_jwt_super_secret_key_change_in_prod_2026}
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started

volumes:
  postgres_data:
  mosquitto_data:
