# Standalone config; never include or edit /etc/mosquitto/conf.d.
listener 8883
allow_anonymous false
require_certificate true
use_identity_as_username true
use_username_as_clientid true
cafile /etc/xnet-rms/broker-pki/ca.crt
certfile /etc/xnet-rms/broker-pki/server.crt
keyfile /etc/xnet-rms/broker-pki/server.key
tls_version tlsv1.2
plugin /opt/xnet-rms/rms_acl.so
plugin_opt_revoked_dir /var/lib/xnet-rms/revoked
persistence false
max_packet_size 70000
message_size_limit 65536
max_inflight_messages 4
max_queued_messages 16
max_queued_bytes 131072
max_connections 11000
log_type error
log_type warning
connection_messages false
